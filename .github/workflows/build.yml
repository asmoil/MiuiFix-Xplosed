name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip source
        run: unzip MiuiFix-XposedModule-src.zip
      - name: Build APK
        working-directory: MiuiFix
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v3
        with:
          name: MiuiFix-APK
          path: MiuiFix/app/build/outputs/apk/release/*.apk
